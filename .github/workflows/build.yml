name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Sync upstream changes
        if: github.event_name == 'workflow_dispatch'
        uses: silvzr/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          target_sync_repo: silvzr/DictateKeyboard
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_repo: DevEmperor/DictateKeyboard
          upstream_sync_branch: main
          git_config_pull_rebase: true
          target_branch_push_args: --force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Persistent Keystore
        run: |
          if [ ! -f "signing.keystore" ]; then
            keytool -genkey -v -keystore signing.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f signing.keystore
            git commit -m "Add permanent debug keystore [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
          mkdir -p ~/.android
          cp signing.keystore ~/.android/debug.keystore

      - name: Grant Execute Permissions
        run: |
          chmod +x gradlew
          chmod +x tools/fetch-sherpa-onnx.sh

      - name: Fetch Sherpa ONNX Libraries
        run: ./tools/fetch-sherpa-onnx.sh

      - name: Build APK
        run: ./gradlew :app:assembleRelease

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dictate Build #${{ github.run_number }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

