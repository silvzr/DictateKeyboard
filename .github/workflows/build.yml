name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Sync upstream changes
        if: github.event_name == 'workflow_dispatch'
        uses: silvzr/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          target_sync_repo: silvzr/DictateKeyboard
          target_sync_branch: sync
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_repo: DevEmperor/DictateKeyboard
          upstream_sync_branch: main
          git_config_pull_rebase: true
          target_branch_push_args: --force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Persistent Keystore
        run: |
          if [ ! -f "signing.keystore" ]; then
            keytool -genkey -v -keystore signing.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f signing.keystore
            git commit -m "Add permanent debug keystore [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
          mkdir -p ~/.android
          cp signing.keystore ~/.android/debug.keystore

      - name: Grant Execute Permissions
        run: |
          chmod +x gradlew
          chmod +x tools/fetch-sherpa-onnx.sh
          if [ -f "tools/bergamot/build-android.sh" ]; then
            chmod +x tools/bergamot/build-android.sh
          fi

      - name: Fetch Sherpa ONNX Libraries
        run: ./tools/fetch-sherpa-onnx.sh

      - name: Cache Bergamot Native Library
        id: cache-bergamot
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libdictate_bergamot.so
          key: bergamot-${{ runner.os }}-${{ hashFiles('tools/bergamot/**', 'gradle/tools.versions.toml') }}

      - name: Build Bergamot Native Library
        if: steps.cache-bergamot.outputs.cache-hit != 'true'
        run: |
          if [ -f "tools/bergamot/build-android.sh" ]; then
            echo "libdictate_bergamot.so not found in cache. Setting up build environment..."
            sudo apt-get update && sudo apt-get install -y ninja-build

            NDK_VERSION="$(grep '^ndk ' gradle/tools.versions.toml | sed -E 's/.*"(.*)".*/\1/')"
            CMAKE_VERSION="$(grep '^cmake ' gradle/tools.versions.toml | sed -E 's/.*"(.*)".*/\1/')"

            echo "Installing NDK $NDK_VERSION..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;$NDK_VERSION"

            echo "Setting up CMake $CMAKE_VERSION..."
            if [ ! -x "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/cmake" ]; then
              yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;$CMAKE_VERSION" || true
            fi

            if [ ! -x "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/cmake" ]; then
              echo "Symlinking system CMake and Ninja to $ANDROID_HOME/cmake/$CMAKE_VERSION/bin..."
              mkdir -p "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin"
              ln -sf "$(which cmake)" "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/cmake"
              ln -sf "$(which ninja)" "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/ninja"
            fi

            echo "Building libdictate_bergamot.so for arm64-v8a..."
            ./tools/bergamot/build-android.sh arm64-v8a
          else
            echo "tools/bergamot/build-android.sh not found, skipping Bergamot build."
          fi

      - name: Build APK
        run: ./gradlew :app:assembleRelease

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dictate Build #${{ github.run_number }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

